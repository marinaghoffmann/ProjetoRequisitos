# Perfil para rodar localmente sem PostgreSQL. Os dados somem ao reiniciar.
spring.datasource.url=jdbc:h2:mem:gametracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valores só para desenvolvimento local: nunca use esta chave nem estas senhas fora da sua máquina.
app.security.jwt.secret-base64=${APP_SECURITY_JWT_SECRET:ZGV2LWxvY2FsLWdhbWUtdHJhY2tlci1jaGF2ZS1qd3QtMzJieXRlcyE=}
app.security.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@gametracker.local}
app.security.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}
# Cria também uma conta de desenvolvedor vinculada à "Umbra Interactive" para testar o cadastro manual.
app.demo.desenvolvedor.email=dev@gametracker.local
app.demo.desenvolvedor.password=dev12345
