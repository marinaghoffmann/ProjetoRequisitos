spring.application.name=game-tracker-backend

# Banco principal: PostgreSQL (suba com "docker compose up -d" na raiz do repositório).
# Sem Docker? Rode com o perfil h2: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gametracker}
spring.datasource.username=${DB_USER:gametracker}
spring.datasource.password=${DB_PASSWORD:gametracker}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Origens liberadas no CORS (frontend Angular em desenvolvimento)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:4200}
