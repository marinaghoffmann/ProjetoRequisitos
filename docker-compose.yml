# Game Tracker: sobe a stack completa com um comando.
#
#   cp .env.example .env               # preencha POSTGRES_PASSWORD e APP_SECURITY_JWT_SECRET
#   docker compose up --build          # sobe banco, backend e frontend
#   docker compose down                # derruba
#   docker compose down -v             # derruba e apaga os volumes (banco e uploads)
#
# Acesso: frontend http://localhost:4200 | API http://localhost:8080 | banco localhost:5432
#
# Só o banco (para rodar backend e frontend fora do Docker):
#   docker compose up -d postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: gametracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gametracker}
      POSTGRES_USER: ${POSTGRES_USER:-gametracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gametracker}
    ports:
      - "5432:5432"
    volumes:
      - gametracker-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: gametracker-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gametracker}
      DB_USER: ${POSTGRES_USER:-gametracker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gametracker}
      # Obrigatória: sem ela o backend não sobe ("APP_SECURITY_JWT_SECRET deve ser uma chave Base64 válida")
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-}
      APP_SECURITY_JWT_EXPIRATION_MINUTES: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:-60}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-Administrador inicial}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:4200}
      APP_MARKETPLACE_ROTINAS: ${APP_MARKETPLACE_ROTINAS:-true}
    ports:
      - "8080:8080"
    volumes:
      - gametracker-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: gametracker-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  gametracker-dados:
  gametracker-uploads:
