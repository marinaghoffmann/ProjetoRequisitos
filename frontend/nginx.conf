server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Journal aceita três imagens de 2 MB na mesma gravação, mais os dados do formulário.
    client_max_body_size 8m;

    # A API e os arquivos enviados ficam no backend (mesma regra do proxy.conf.json do ng serve)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # Rotas do Angular: qualquer caminho desconhecido devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
